name: Automated Code Review by ChatGPT

on:
  pull_request:
    types: [opened, synchronize]
    branches:
      - main

permissions:
  pull-requests: write
  contents: read

jobs:
  review:
    name: AI Code Reviewer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Required NodeJS Dependencies
        run: npm install @actions/github @actions/core openai

      - name: Run AI Code Review
        uses: actions/github-script@v7
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        with:
          script: |
            const fs = require('fs');
            const { OpenAI } = require('openai');

            // Initialize the OpenAI Client
            const openai = new OpenAI({
              apiKey: process.env.OPENAI_API_KEY,
            });

            // Extract pull request context information
            const { owner, repo, number: pull_number } = context.issue;

            try {
              // 1. Fetch the git diff data of the PR from the GitHub API
              const response = await github.rest.pulls.get({
                owner,
                repo,
                pull_number,
                mediaType: { format: 'diff' },
              });
              const diffData = response.data;

              if (!diffData || diffData.trim().length === 0) {
                console.log("No source code changes found in this PR.");
                return;
              }

              // Limit the diff character length to avoid exceeding API token limits (Approx. 25,000 characters)
              const truncatedDiff = diffData.substring(0, 25000);

              // 2. Set up the optimized Prompt for Playwright BDD and Ollama Framework
              const prompt = `You are a Senior Automation QA Engineer and a Software Architect.
              Please review the following code changes (git diff) from an Automation Testing project built with Playwright BDD Framework, which includes an AI-driven Self-Healing feature powered by Ollama.

              Please focus your review thoroughly on the following aspects:
              1. Asynchronous Handling: Are Playwright commands properly using 'await'? Are there any risks of race conditions or incorrect locator resolution?
              2. Self-Healing & Caching Mechanism: Is the read/write logic for configuration files (YAML/JSON) used to store healed locators via Ollama optimized? Are there potential issues when running tests in parallel?
              3. Resource & Error Management: When Ollama is not installed or encounters a connection error, does the system fallback/bypass safely? Are there any memory leaks or crash risks?
              4. Code Smell & Clean Code: Suggest ways to optimize the source code to make it more concise and maintainable according to BDD standards.

              Response Requirements:
              - Language: English.
              - Formatting: Use clear Markdown with headings and lists. Point out the problematic code segments and provide refactored code blocks as examples where applicable.
              - Tone: Constructive, professional, and concise.

              Code changes (git diff):
              ${truncatedDiff}`;

              // 3. Send the request to the GPT-4o model
              const aiResponse = await openai.chat.completions.create({
                model: "gpt-4o", // You can switch to "gpt-4o-mini" to reduce API consumption costs
                messages: [{ role: "user", content: prompt }],
                temperature: 0.2, // Lower creativity for higher technical precision
              });

              const reviewComment = aiResponse.choices.message.content;

              // 4. Create a consolidated comment on the Pull Request
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pull_number,
                body: `### 🤖 AI Code Reviewer Report\n\nHello! I have analyzed the changes made in this PR. Here is my detailed review:\n\n${reviewComment}`,
              });
              
              console.log("Successfully posted the review comment to the PR!");

            } catch (error) {
              console.error("Error occurred during AI Review execution:", error);
              core.setFailed(error.message);
            }
