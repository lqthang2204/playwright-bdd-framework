elements:
  - id: Sign-in-button
    description: A menu item that links to Dashboard
    cache: true
    timeout: 5000
    locators:
      - device: DESKTOP
        type: locator
        value: //*[text()="Sign In"]
      - device: IOS
        type: ACCESSIBILITY_ID
        value: Add alarm
      - device: ANDROID
        type: ID
        value: com.android.chrome:id/signin_fre_dismiss_button
  - id: Sign-in-button-2
    description: A menu item that links to Dashboard
    cache: true
    timeout: 5000
    locators:
      - device: DESKTOP
        type: getByRole
        role: link
        name: Sign In
      - device: IOS
        type: ACCESSIBILITY_ID
        value: Add alarm
      - device: ANDROID
        type: ID
        value: com.android.chrome:id/signin_fre_dismiss_button
  - id: rdb_bmw
    description: option for BMW in the radio button group
    cache: true
    locators:
      - device: DESKTOP
        chain:
          - type: locator
            value: '#radio-btn-example'
          - type: getByText
            value: BMW
      - device: ANDROID
        type: ID
        value: com.example.android:id/dashboard_title
  - id: rdb_bmw_2
    description: option for BMW in the radio button group
    cache: true
    locators:
      - device: DESKTOP
        chain:
          - type: locator
            value: '#bmwradio'
      - device: ANDROID
        type: ID
        value: com.example.android:id/dashboard_title
  - id: rdb_benz
    description: option for benz in the radio button group
    cache: true
    locators:
      - device: DESKTOP
        chain:
          - type: locator
            value: '#benzradio'
      - device: ANDROID
        type: locator
        value: '#bmwradio'
      - device: ANDROID
        type: ID
        value: com.example.android:id/dashboard_title
  - id: rdb_button_group
    description: radio button group
    cache: true
    locators:
      - device: DESKTOP
        chain:
          - type: getByRole
            role: group
            name: Radio Button Example
      - device: ANDROID
        type: ID
        value: com.example.android:id/dashboard_title
  - id: check_box_honda
    description: field check box
    cache: true
    locators:
      - device: DESKTOP
        chain:
          - type: locator
            value: '#hondacheck'
      - device: ANDROID
        type: ID
        value: com.example.android:id/dashboard_title
  - id: check_box_benz
    description: field check box benz
    cache: true
    locators:
      - device: DESKTOP
        chain:
          - type: locator
            value: '#benzcheck'
      - device: ANDROID
        type: ID
        value: com.example.android:id/dashboard_title
  - id: check_box_bmw
    description: field check box bmw
    cache: true
    locators:
      - device: DESKTOP
        chain:
          - type: locator
            value: '#bmwcheck'
      - device: ANDROID
        type: ID
        value: com.example.android:id/dashboard_title
  - id: chk-honda
    description: option for Honda in the checkbox group
    cache: true
    locators:
      - device: DESKTOP
        type: locator
        value: '#hondacheck'
      - device: ANDROID
        type: ID
        value: com.example.android:id/dashboard_title
  - id: text_field_start
    description: field text start
    cache: true
    locators:
      - device: DESKTOP
        chain:
          - type: getByRole
            role: textbox
            name: Start Typing...
      - device: ANDROID
        type: ID
        value: com.example.android:id/dashboard_title

#         page.getByRole() to locate by explicit and implicit accessibility attributes.
# page.getByText() to locate by text content.
# page.getByLabel() to locate a form control by associated label's text.
# page.getByPlaceholder() to locate an input by placeholder.
# page.getByAltText() to locate an element, usually image, by its text alternative.
# page.getByTitle() to locate an element by its title attribute.
# page.getByTestId() to locate an element based on its data-testid attribute (other attributes can be configured).