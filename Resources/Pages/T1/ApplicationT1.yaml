elements:
  - id: Add-Application-button
    description: Add new application button
    cache: true
    locators:
      - device: DESKTOP
        chain:
          - type: getByRole
            role: button
            name: Add a new application
      - device: IOS
        type: ACCESSIBILITY_ID
        value: Add alarm
      - device: ANDROID
        type: uiautomator
        value: new UiSelector().resourceId("com.android.chrome:id/signin_fre_dismiss_button")
  - id: page-spinner
    description: spinner loading indicator
    cache: true
    locators:
      - device: DESKTOP
        chain:
          - type: getBylabel
            value: page spinner
          - type: locator
            value: div
      - device: IOS
        type: ACCESSIBILITY_ID
        value: Add alarm
      - device: ANDROID
        type: uiautomator
        value: new UiSelector().resourceId("com.android.chrome:id/signin_fre_dismiss_button")
  - id: Application-option
    description: Application option in menu
    cache: true
    timeout: 5000
    locators:
      - device: DESKTOP
        chain:
          - type: locator
            value: a
            filter:
              hasText: Applications Admissions and
      - device: ANDROID
        type: id
        value: com.android.chrome:id/negative_button
  - id: userName
    description: A menu item that links to Dashboard
    cache: true
    timeout: 5000
    locators:
      - device: DESKTOP
        chain:
          - type: GETBYROLE
            role: textbox
            name: User name or email address
      - device: IOS
        type: ACCESSIBILITY_ID
        value: Add alarm
      - device: ANDROID
        type: uiautomator
        value: new UiSelector().resourceId("com.android.chrome:id/signin_fre_dismiss_button")
  - id: password
    description: A menu item that links to Dashboard
    cache: true
    timeout: 5000
    locators:
      - device: DESKTOP
        chain:
          - type: GETBYROLE
            role: textbox
            name: Password
      - device: IOS
        type: ACCESSIBILITY_ID
        value: Add alarm
      - device: ANDROID
        type: uiautomator
        value: new UiSelector().resourceId("com.android.chrome:id/signin_fre_dismiss_button")
  - id: logon-button
    description: A menu item that links to Dashboard
    cache: true
    timeout: 5000
    locators:
      - device: DESKTOP
        chain:
          - type: GETBYROLE
            role: button
            name: Log on
      - device: ANDROID
        type: XPATH
        value: //android.widget.Button[@resource-id="BtnLogOn"]